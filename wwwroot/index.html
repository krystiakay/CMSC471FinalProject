<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>YELLOW SIGN DINER | INDUSTRIAL TERMINAL</title>
<!-- React and Babel for single-file implementation -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;family=Epilogue:wght@300;400;500;600&amp;family=JetBrains+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [inboxItems, setInboxItems] = useState([]);
            const [records, setRecords] = useState([]);
            const [logs, setLogs] = useState([]);
            const [selectedFile, setSelectedFile] = useState(null);
            const fileInputRef = useRef(null);

            const API = window.location.origin + '/Prod';

            useEffect(() => {
                loadInbox();
                loadRecords();
            }, []);

            const addLog = (message) => {
                setLogs((prev) => [
                    ...prev,
                    {
                        id: Date.now(),
                        time: new Date().toLocaleTimeString(),
                        msg: message,
                    },
                ]);
            };

            const normalizeRecords = (rows) => {
                if (!Array.isArray(rows)) return [];
                return rows.map((row, index) => ({
                    id: row.id ?? index,
                    filename: row.item ?? row.filename ?? `record-${index + 1}`,
                    status: (row.status || 'SAVED').toString().toUpperCase(),
                    time: row.time ?? (row.created_at ? new Date(row.created_at).toLocaleString() : ''),
                }));
            };

            const loadInbox = async () => {
                try {
                    const res = await fetch(`${API}/api/inbox`);
                    if (!res.ok) throw new Error(`Inbox failed: ${res.status}`);
                    const files = await res.json();
                    setInboxItems(Array.isArray(files) ? files.map((name, index) => ({ id: index + 1, name })) : []);
                } catch (error) {
                    addLog(error.message);
                }
            };

            const uploadFile = async (file) => {
                if (!file) return;
                try {
                    const createRes = await fetch(`${API}/api/inbox`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file.name, contentType: file.type || 'application/octet-stream' }),
                    });
                    if (!createRes.ok) throw new Error(`Upload init failed: ${createRes.status}`);
                    const data = await createRes.json();
                    await fetch(data.url, {
                        method: 'PUT',
                        headers: { 'Content-Type': file.type || 'application/octet-stream' },
                        body: file,
                    });
                    addLog(`Uploaded ${file.name}`);
                    await loadInbox();
                } catch (error) {
                    addLog(error.message);
                }
            };

            const deleteFile = async (filename) => {
                try {
                    const res = await fetch(`${API}/api/inbox/${encodeURIComponent(filename)}`, {
                        method: 'DELETE',
                    });
                    if (!res.ok) throw new Error(`Delete failed: ${res.status}`);
                    addLog(`Deleted ${filename}`);
                    if (selectedFile === filename) setSelectedFile(null);
                    await loadInbox();
                } catch (error) {
                    addLog(error.message);
                }
            };

            const loadRecords = async () => {
                try {
                    const res = await fetch(`${API}/api/records`);
                    if (!res.ok) throw new Error(`Records failed: ${res.status}`);
                    const data = await res.json();
                    setRecords(normalizeRecords(data));
                } catch (error) {
                    addLog(error.message);
                }
            };

            const processSelectedFile = async () => {
                if (!selectedFile) {
                    addLog('No inbox item selected to process.');
                    return;
                }

                try {
                    const res = await fetch(`${API}/api/jobs`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: selectedFile }),
                    });
                    if (!res.ok) throw new Error(`Job submit failed: ${res.status}`);
                    const job = await res.json();
                    const jobId = job.jobId || job.id || job.job_id;
                    if (!jobId) throw new Error('Missing jobId from response');

                    addLog(`Started job ${jobId}`);
                    const intervalId = setInterval(async () => {
                        try {
                            const pollRes = await fetch(`${API}/api/jobs/${jobId}`);
                            if (!pollRes.ok) throw new Error(`Job poll failed: ${pollRes.status}`);
                            const jobStatus = await pollRes.json();
                            addLog(jobStatus.message || `Status: ${jobStatus.status}`);

                            if (jobStatus.status === 'SUCCEEDED' || jobStatus.status === 'FAILED') {
                                clearInterval(intervalId);
                                await loadRecords();
                            }
                        } catch (error) {
                            addLog(error.message);
                            clearInterval(intervalId);
                        }
                    }, 2000);
                } catch (error) {
                    addLog(error.message);
                }
            };

            const handleFileChange = (event) => {
                const file = event.target.files?.[0];
                if (file) {
                    uploadFile(file);
                    event.target.value = '';
                }
            };

            const handleLoadRecords = () => loadRecords();
            const handleClearRecords = () => setRecords([]);
            const handleDeleteAllRecords = () => {
                setRecords([]);
                addLog('Records cleared from view.');
            };

            return (
                <div className="app-container">
                    <input
                        type="file"
                        accept="image/*"
                        ref={fileInputRef}
                        style={{ display: 'none' }}
                        onChange={handleFileChange}
                    />

                    <header className="main-header">
                        <div className="header-left">
                            <span className="material-symbols-outlined">terminal</span>
                            <h1 className="logo-text">YELLOW SIGN DINER</h1>
                        </div>
                        <div className="header-right">
                            <span className="material-symbols-outlined">account_circle</span>
                        </div>
                    </header>

                    <main className="terminal-grid">
                        <section className="panel">
                            <div className="panel-header">
                                <h2 className="panel-title">INBOX</h2>
                            </div>
                            <div className="panel-content scrollable">
                                <table className="data-table" id="inbox-list">
                                    <thead>
                                        <tr>
                                            <th>FILENAME</th>
                                            <th className="text-right">ACTION</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {inboxItems.length === 0 ? (
                                            <tr>
                                                <td colSpan="2" className="py-6 text-center text-[#b0ada6] italic text-sm">
                                                    No files in inbox.
                                                </td>
                                            </tr>
                                        ) : (
                                            inboxItems.map((item) => (
                                                <tr
                                                    key={item.id}
                                                    onClick={() => setSelectedFile(item.name)}
                                                    style={{
                                                        outline: selectedFile === item.name ? '2px solid #ffd700' : 'none',
                                                        cursor: 'pointer',
                                                    }}
                                                >
                                                    <td>{item.name}</td>
                                                    <td className="text-right">
                                                        <button
                                                            className="icon-btn"
                                                            onClick={(event) => {
                                                                event.stopPropagation();
                                                                deleteFile(item.name);
                                                            }}
                                                        >
                                                            <span className="material-symbols-outlined">close</span>
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            <div className="panel-footer">
                                <button
                                    className="primary-btn"
                                    id="upload-btn"
                                    onClick={() => fileInputRef.current?.click()}
                                >
                                    <span className="material-symbols-outlined">upload_file</span>
                                    UPLOAD FILE
                                </button>
                            </div>
                        </section>

                        <section className="panel border-x">
                            <div className="panel-header">
                                <h2 className="panel-title">PROCESS</h2>
                            </div>
                            <div className="panel-content">
                                <div className="button-container">
                                    <button className="outline-btn" id="process-btn" onClick={processSelectedFile}>
                                        EXECUTE_RENDER_PROCESS
                                    </button>
                                </div>
                                <div className="console-wrapper">
                                    <div className="console-header">TERMINAL_OUTPUT_V4.1</div>
                                    <div className="console-body scrollable" id="log-area">
                                        {logs.map((log) => (
                                            <p key={log.id} className="log-line">
                                                <span className="yellow-text">[{log.time}]</span> {log.msg}
                                            </p>
                                        ))}
                                        <p className="cursor">_</p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section className="panel">
                            <div className="panel-header">
                                <h2 className="panel-title">RECORDS</h2>
                            </div>
                            <div className="panel-content scrollable">
                                <table className="data-table" id="records-table">
                                    <thead>
                                        <tr>
                                            <th>FILENAME</th>
                                            <th>STATUS</th>
                                            <th className="text-right">TIME</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {records.length === 0 ? (
                                            <tr>
                                                <td colSpan="3" className="py-6 text-center text-[#b0ada6] italic text-sm">
                                                    No records yet. Process an image to see results.
                                                </td>
                                            </tr>
                                        ) : (
                                            records.map((record) => (
                                                <tr key={record.id}>
                                                    <td>{record.filename}</td>
                                                    <td>
                                                        <span className={`badge ${record.status === 'FAIL' ? 'badge-error' : 'badge-success'}`}>
                                                            {record.status}
                                                        </span>
                                                    </td>
                                                    <td className="text-right dim-text">{record.time}</td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            <div className="panel-footer footer-actions">
                                <div className="row">
                                    <button className="secondary-btn" onClick={handleLoadRecords}>
                                        LOAD RECORDS
                                    </button>
                                    <button className="secondary-btn" onClick={handleClearRecords}>
                                        CLEAR
                                    </button>
                                </div>
                                <button className="danger-btn" onClick={handleDeleteAllRecords}>
                                    DELETE ALL RECORDS
                                </button>
                            </div>
                        </section>
                    </main>

                    <footer className="main-footer">
                        <div className="footer-left">
                            <div className="pulse-dot"></div>
                            <span>YELLOW SIGN INDUSTRIAL ©2024</span>
                        </div>
                        <div className="footer-right">
                            SYSTEM_STATUS: <span className="yellow-text">OPTIMAL</span>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<style>
        /* BASE STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #131313; 
            color: #FFFDD0; 
            font-family: 'Epilogue', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* LAYOUT */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        .main-header { 
            background-color: #000; 
            color: #FFEB00; 
            padding: 1rem 1.5rem; 
            border-bottom: 2px solid #FFEB00; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .logo-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.1em; }
        
        .terminal-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            flex: 1; 
            overflow: hidden; 
            background-color: #000;
        }
        
        .panel { 
            background-color: #2d2d2d; 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            min-width: 0;
        }
        .border-x { 
            border-left: 1px solid rgba(255, 253, 208, 0.2); 
            border-right: 1px solid rgba(255, 253, 208, 0.2); 
        }

        /* PANEL COMPONENTS */
        .panel-header { 
            padding: 1rem; 
            border-bottom: 1px solid rgba(255, 253, 208, 0.2); 
            background-color: #1a1a1a;
        }
        .panel-title { 
            font-family: 'Space Grotesk', sans-serif; 
            font-size: 0.75rem; 
            color: #FFEB00; 
            letter-spacing: 0.2em; 
            text-shadow: 0 0 10px rgba(255, 235, 0, 0.3);
        }
        .panel-content { flex: 1; padding: 1.25rem; display: flex; flex-direction: column; min-height: 0; }
        .panel-footer { padding: 1rem; background-color: #1a1a1a; border-top: 1px solid rgba(255, 253, 208, 0.1); }
        .scrollable { overflow-y: auto; }

        /* TABLES */
        .data-table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .data-table th { text-align: left; color: #FFEB00; padding: 0.5rem; border-bottom: 1px solid rgba(255, 253, 208, 0.2); font-weight: normal; }
        .data-table td { padding: 0.75rem 0.5rem; border-bottom: 1px solid rgba(255, 253, 208, 0.1); }
        .text-right { text-align: right; }
        .dim-text { color: rgba(255, 253, 208, 0.5); }

        /* CONSOLE */
        .button-container { margin-bottom: 1.5rem; }
        .console-wrapper { flex: 1; display: flex; flex-direction: column; background-color: #000; border: 1px solid rgba(255, 253, 208, 0.2); }
        .console-header { background-color: #1a1a1a; padding: 0.4rem 0.75rem; font-size: 10px; color: rgba(255, 253, 208, 0.4); font-family: 'JetBrains Mono', monospace; }
        .console-body { flex: 1; padding: 0.75rem; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(255, 253, 208, 0.8); line-height: 1.6; }
        .log-line { margin-bottom: 4px; }
        .yellow-text { color: #FFEB00; }
        .cursor { animation: blink 1s step-end infinite; color: #FFEB00; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* BUTTONS */
        .primary-btn { 
            width: 100%; background-color: #FFEB00; color: #000; border: none; padding: 0.9rem; 
            font-family: 'Space Grotesk', sans-serif; font-weight: bold; letter-spacing: 0.1em; 
            display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; 
        }
        .outline-btn { 
            width: 100%; background: transparent; color: #FFEB00; border: 2px solid #FFEB00; padding: 0.9rem;
            font-family: 'Space Grotesk', sans-serif; font-weight: bold; letter-spacing: 0.1em; cursor: pointer;
        }
        .outline-btn:hover { background-color: #FFEB00; color: #000; }
        .secondary-btn { 
            flex: 1; background: transparent; color: #FFFDD0; border: 1px solid rgba(255, 253, 208, 0.4); 
            padding: 0.6rem; font-size: 11px; cursor: pointer;
        }
        .secondary-btn:hover { border-color: #FFFDD0; }
        .danger-btn { 
            width: 100%; background: transparent; color: #ffb4ab; border: 1px solid #ffb4ab; 
            padding: 0.6rem; font-size: 11px; cursor: pointer; margin-top: 0.5rem;
        }
        .danger-btn:hover { background-color: #ffb4ab; color: #000; }
        .icon-btn { background: none; border: none; color: #ffb4ab; cursor: pointer; display: flex; }

        /* BADGES */
        .badge { font-size: 10px; padding: 2px 6px; border: 1px solid; }
        .badge-success { color: #FFEB00; border-color: #FFEB00; }
        .badge-error { color: #ffb4ab; border-color: #ffb4ab; }

        /* FOOTER */
        .main-footer { 
            background: #000; padding: 1rem 1.5rem; border-top: 1px solid #FFFDD0; color: #FFEB00; 
            font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.1em;
            display: flex; justify-content: space-between; align-items: center;
        }
        .footer-left { display: flex; align-items: center; gap: 0.75rem; }
        .pulse-dot { width: 6px; height: 6px; background: #FFEB00; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* UTILS */
        .row { display: flex; gap: 0.5rem; }
        .footer-actions { display: flex; flex-direction: column; gap: 0.5rem; }

        /* SCROLLBAR */
        .scrollable::-webkit-scrollbar { width: 4px; }
        .scrollable::-webkit-scrollbar-track { background: #1a1a1a; }
        .scrollable::-webkit-scrollbar-thumb { background: #FFEB00; }

        @media (max-width: 900px) {
            .terminal-grid { grid-template-columns: 1fr; overflow-y: auto; }
            .panel { min-height: 400px; border-bottom: 1px solid rgba(255, 253, 208, 0.2); }
            body { overflow-y: auto; }
        }
    </style>
</body></html>
